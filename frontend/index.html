<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lane Detection</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main>
    <header>
      <h1>Lane Detection</h1>
      <p>Drop a dashcam video to start detecting lane.</p>
    </header>

    <div id="dropzone" class="dropzone">
      <input type="file" id="fileInput" accept="video/*" hidden />
      <p><strong>Drop a video here</strong> or click to browse</p>
      <p class="hint">MP4 / MOV / etc. · up to 100&nbsp;MB · only the first ~30s is processed</p>
    </div>

    <p id="status" class="status" hidden></p>

    <div id="videos" class="videos" hidden>
      <div class="video-pane">
        <h2>Before</h2>
        <video id="originalVideo" controls></video>
      </div>
      <div class="video-pane">
        <h2>After</h2>
        <video id="resultVideo" controls></video>
      </div>
    </div>

    <div id="actions" class="actions" hidden>
      <button id="processBtn" type="button">Detect lanes</button>
      <button id="resetBtn" type="button" class="secondary">Choose another video</button>
    </div>

    <footer>BEV polynomial-fit lane detection</footer>
  </main>

  <script src="app.js"></script>
</body>
</html>
